<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans)}
#root{padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.col{display:flex;flex-direction:column;gap:16px;width:100%}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}

</style></head><body><div id="root"></div>

const h=React.createElement, B=window.MostCritical, F=React.Fragment;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'col'},
 h('div',{className:'row'},
  h(B.Button,{icon:'star'},'Noter ce film'),
  h(B.Button,{variant:'secondary',icon:'plus'},'Ma liste'),
  h(B.Button,{variant:'accent',icon:'play'},'Bande-annonce'),
  h(B.Button,{variant:'ghost'},'Annuler'),
  h(B.Button,{disabled:true},'Indisponible')),
 h('div',{className:'row'},
  h(B.Button,{size:'lg',icon:'comment'},'Écrire une critique'),
  h(B.Button,{size:'sm',variant:'secondary'},'Suivre'),
  h(B.Button,{size:'sm'},'Voir tout'))));
</script></body></html>
